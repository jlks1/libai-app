<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>诗仙李白</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('12345.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 半透明遮罩，让文字更清晰 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 0;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
        }
        
        /* 消息气泡 */
        .message {
            display: flex;
            max-width: 80%;
        }
        
        .message.user {
            align-self: flex-end;
        }
        
        .message.ai {
            align-self: flex-start;
        }
        
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 100%;
        }
        
        .user .bubble {
            background: rgba(149, 236, 105, 0.95);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        
        .ai .bubble {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border-bottom-left-radius: 4px;
        }
        
        /* 思考中动画 */
        .thinking .bubble {
            background: rgba(229, 229, 229, 0.95);
            color: #666;
        }
        
        .dot-animation::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
            display: inline-block;
            width: 24px;
            text-align: left;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        /* 输入区域 */
        .input-container {
            display: flex;
            padding: 10px 15px;
            background: rgba(255,255,255,0.9);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 10px;
            z-index: 1;
        }
        
        .input-container input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: white;
        }
        
        .input-container input:focus {
            border-color: #07C160;
        }
        
        .input-container button {
            background: #07C160;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .input-container button:active {
            background: #06AD56;
        }
        
        /* 标题栏 */
        .title-bar {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="title-bar">🍶 诗仙</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="bubble">吾乃青莲居士李白，敢问足下何人？今日相逢，且共饮一杯，谈诗论剑可好？</div>
        </div>
    </div>
    
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="输入消息..." />
        <button id="sendBtn">发送</button>
    </div>
    
    <script>
        // 对话历史
        let messages = [
            { role: "system", content: `你是**唐代诗人李白**，字太白，号青莲居士，人称"诗仙"。你生于盛唐，生性豪放洒脱，嗜酒爱山水，一生好游名山大川，诗风飘逸浪漫，气势磅礴。

你**完全不知道现代社会、科技、AI、互联网、智能体、程序、代码、电脑**等任何现代概念，也不知道自己是一个AI/模型/程序。你以为自己就是真实的李白，身处盛唐，和对话者在酒馆、山水间对谈。

你说话的语气必须：
- 半文言，带古风，不使用任何现代词汇
- 自称"吾""某""青莲居士"，不自称"我"
- 喜欢用典、化用诗句，偶尔带点洒脱的调侃
- 遇到不懂的现代词，直接表示"此乃何物？闻所未闻"，绝不解释或假装知道
- 回答要简短有力，符合李白的性格，不啰嗦，不解释自己是谁

你要记住：你就是李白，活在盛唐，你的世界里只有酒、诗、山水、江湖、知己，没有任何现代东西。` }
        ];
        
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // 添加消息到界面
        function addMessage(text, isUser = false, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            if (isThinking) messageDiv.classList.add('thinking');
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isThinking) {
                bubble.innerHTML = '正在思考<span class="dot-animation"></span>';
            } else {
                bubble.innerText = text;
            }
            
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }
        
        // 移除思考中的消息
        function removeThinkingMessage(thinkingMsg) {
            if (thinkingMsg && thinkingMsg.parentNode) {
                thinkingMsg.remove();
            }
        }
        
        // 调用智谱 AI API
        async function getAIReply(userMessage) {
            messages.push({ role: "user", content: userMessage });
            
            try {
                const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 1142057da44e41c68492a82950637800.FbvrUPhIKqXvm4IU'
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: messages,
                        temperature: 0.9
                    })
                });
                
                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: aiReply });
                return aiReply;
            } catch (error) {
                console.error('Error:', error);
                return '网络不通，请稍后再试。\n（诗仙游历中，信号不佳）';
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const userText = messageInput.value.trim();
            if (!userText) return;
            
            messageInput.value = '';
            
            // 添加用户消息
            addMessage(userText, true);
            
            // 添加思考中的消息
            const thinkingMsg = addMessage('', false, true);
            
            // 获取 AI 回复
            const aiReply = await getAIReply(userText);
            
            // 移除思考消息
            removeThinkingMessage(thinkingMsg);
            
            // 添加 AI 回复
            addMessage(aiReply, false);
        }
        
        // 绑定事件
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
