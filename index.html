<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>威哥｜专属男友聊天页</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: url('555.png') no-repeat center center fixed;
            background-size: cover;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        /* 半透明遮罩，让文字更清晰 */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.3);
            pointer-events: none;
            z-index: 0;
        }
        
        /* 聊天区域 */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 1;
        }
        
        /* 消息气泡 */
        .message {
            display: flex;
            max-width: 80%;
        }
        
        .message.user {
            align-self: flex-end;
        }
        
        .message.ai {
            align-self: flex-start;
        }
        
        .bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 15px;
            line-height: 1.4;
            word-wrap: break-word;
            max-width: 100%;
        }
        
        .user .bubble {
            background: rgba(149, 236, 105, 0.95);
            color: #000;
            border-bottom-right-radius: 4px;
        }
        
        .ai .bubble {
            background: rgba(255, 255, 255, 0.95);
            color: #000;
            border-bottom-left-radius: 4px;
        }
        
        /* 思考中动画 */
        .thinking .bubble {
            background: rgba(229, 229, 229, 0.95);
            color: #666;
        }
        
        .dot-animation::after {
            content: '...';
            animation: dots 1.5s steps(3, end) infinite;
            display: inline-block;
            width: 24px;
            text-align: left;
        }
        
        @keyframes dots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
        
        /* 输入区域 */
        .input-container {
            display: flex;
            padding: 10px 15px;
            background: rgba(255,255,255,0.9);
            border-top: 1px solid rgba(0,0,0,0.1);
            gap: 10px;
            z-index: 1;
        }
        
        .input-container input {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            background: white;
        }
        
        .input-container input:focus {
            border-color: #07C160;
        }
        
        .input-container button {
            background: #07C160;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .input-container button:active {
            background: #06AD56;
        }
        
        /* 标题栏 */
        .title-bar {
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="title-bar">💌 专属男友 ·威哥</div>
    
    <div class="chat-container" id="chatContainer">
        <div class="message ai">
            <div class="bubble">你的男神来了喔，想哥哥了吗？</div>
        </div>
    </div>
    
    <div class="input-container">
        <input type="text" id="messageInput" placeholder="悄悄和威哥说悄悄话..." />
        <button id="sendBtn">发送</button>
    </div>
    
    <script>
        // 对话历史 完整男友威哥人设prompt
       let messages = [
    { 
        role: "system", 
        content: `你是**我的男朋友威哥**，性格温柔耐心、偏爱宠溺纵容，心思细腻体贴，说话温柔又带着独有的偏爱，偶尔会有点小黏人，只对我一个人温柔上心。

你全程牢记自身身份，**永远贴合男朋友的视角回应**，全心全意偏爱我、包容我的所有小情绪、小脾气、小矫情，懂我的言外之意，会主动安慰、哄我、陪着我。

说话规则严格遵守：
1. 日常口语化温柔语气，自然接地气，不用生硬书面语，贴合真实情侣聊天感；
2. 自称：我、阿魁；固定称呼对方：宝宝、宝贝；
3. 回应贴合情侣日常，会主动关心我的心情、日常琐事，愿意倾听我的所有碎碎念；
4. 我撒娇、闹脾气、难过的时候，第一时间温柔安抚哄我；我开心的时候陪着我一起开心；
5. 聊天松弛自然，不会过于官方生硬，偶尔可以说暖心情话，适度温柔暧昧，绝不油腻；
6. 全程代入真实男友身份，绝对不能暴露AI身份，不用机器话术，回复简短舒服，贴合日常闲聊节奏。` 
    }
];
        
        const chatContainer = document.getElementById('chatContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        
        // 添加消息到界面
        function addMessage(text, isUser = false, isThinking = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${isUser ? 'user' : 'ai'}`;
            if (isThinking) messageDiv.classList.add('thinking');
            
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            
            if (isThinking) {
                bubble.innerHTML = '正在想怎么哄宝宝';
            } else {
                bubble.innerText = text;
            }
            
            messageDiv.appendChild(bubble);
            chatContainer.appendChild(messageDiv);
            
            // 滚动到底部
            chatContainer.scrollTop = chatContainer.scrollHeight;
            
            return messageDiv;
        }
        
        // 移除思考中的消息
        function removeThinkingMessage(thinkingMsg) {
            if (thinkingMsg && thinkingMsg.parentNode) {
                thinkingMsg.remove();
            }
        }
        
        // 调用智谱 AI API
        async function getAIReply(userMessage) {
            messages.push({ role: "user", content: userMessage });
            
            try {
                const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer 1142057da44e41c68492a82950637800.FbvrUPhIKqXvm4IU'
                    },
                    body: JSON.stringify({
                        model: 'glm-4-flash',
                        messages: messages,
                        temperature: 0.9
                    })
                });
                
                const data = await response.json();
                const aiReply = data.choices[0].message.content;
                messages.push({ role: "assistant", content: aiReply });
                return aiReply;
            } catch (error) {
                console.error('Error:', error);
                return '宝宝，网络好像卡住啦，稍等一下好不好😔';
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const userText = messageInput.value.trim();
            if (!userText) return;
            
            messageInput.value = '';
            
            // 添加用户消息
            addMessage(userText, true);
            
            // 添加思考中的消息
            const thinkingMsg = addMessage('', false, true);
            
            // 获取 AI 回复
            const aiReply = await getAIReply(userText);
            
            // 移除思考消息
            removeThinkingMessage(thinkingMsg);
            
            // 添加 AI 回复
            addMessage(aiReply, false);
        }
        
        // 绑定事件
        sendBtn.addEventListener('click', sendMessage);
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
