name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk wget
        pip install buildozer cython
    
    - name: Configure buildozer
      run: |
        buildozer init
        sed -i 's/title = .*/title = 诗仙李白/' buildozer.spec
        sed -i 's/package.name = .*/package.name = libai/' buildozer.spec
        sed -i 's/package.domain = .*/package.domain = com.libai/' buildozer.spec
        sed -i 's/requirements = .*/requirements = python3,kivy==2.1.0,openssl,requests,openai/' buildozer.spec
        echo "android.permissions = INTERNET" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
    
    - name: Build APK
      run: |
        buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: libai-apk
        path: bin/*.apk
