name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk wget
        pip install buildozer cython
        # 预装 Android SDK command-line tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        unzip commandlinetools-linux-*.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        export PATH=$PATH:~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        # 自动接受 licenses
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
        # 安装 build-tools 和 platform-tools
        ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "build-tools;30.0.3" "platform-tools" "platforms;android-30" || true
    
    - name: Build APK
      run: |
        buildozer init
        sed -i 's/title = .*/title = 诗仙李白/' buildozer.spec
        sed -i 's/package.name = .*/package.name = libai/' buildozer.spec
        sed -i 's/package.domain = .*/package.domain = com.libai/' buildozer.spec
        sed -i 's/requirements = .*/requirements = python3,kivy,openssl,requests,openai/' buildozer.spec
        sed -i 's/android.ndk = .*/android.ndk = 23b/' buildozer.spec
        sed -i 's/android.sdk = .*/android.sdk = 30/' buildozer.spec
        sed -i 's/android.api = .*/android.api = 30/' buildozer.spec
        echo "android.permissions = INTERNET" >> buildozer.spec
        echo "android.accept_sdk_license = True" >> buildozer.spec
        
        buildozer -v android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: libai-apk
        path: bin/*.apk
